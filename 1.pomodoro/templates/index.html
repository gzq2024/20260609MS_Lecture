<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="window-card">

    <!-- ヘッダー -->
    <div class="window-header">
      <span class="window-title">ポモドーロタイマー</span>
      <div class="window-controls" aria-hidden="true">
        <span class="wc-btn">&#8722;</span>
        <span class="wc-btn">&#9633;</span>
        <span class="wc-btn">&#215;</span>
      </div>
    </div>

    <!-- モード表示 -->
    <p class="mode-label" id="modeLabel">作業中</p>

    <!-- 円形プログレスリング + 残り時間 -->
    <div class="timer-ring-wrapper">
      <svg class="timer-ring" viewBox="0 0 200 200" aria-hidden="true">
        <!-- トラック（背景リング） -->
        <circle
          class="ring-track"
          cx="100" cy="100" r="80"
          fill="none"
          stroke-width="14"
        />
        <!-- プログレスリング（残り時間に応じて変化） -->
        <circle
          class="ring-progress"
          id="ringProgress"
          cx="100" cy="100" r="80"
          fill="none"
          stroke-width="14"
          stroke-linecap="round"
          transform="rotate(-90 100 100)"
        />
      </svg>
      <div class="timer-display">
        <span class="timer-text" id="timerText">25:00</span>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn" type="button">開始</button>
      <button class="btn btn-outline" id="resetBtn" type="button">リセット</button>
    </div>

    <!-- 設定 -->
    <div class="settings-card">
      <p class="settings-title">カスタマイズ</p>
      <div class="settings-grid">
        <label class="setting-item">
          <span>作業時間</span>
          <select id="workDurationSelect">
            <option value="15">15分</option>
            <option value="25" selected>25分</option>
            <option value="35">35分</option>
            <option value="45">45分</option>
          </select>
        </label>
        <label class="setting-item">
          <span>休憩時間</span>
          <select id="breakDurationSelect">
            <option value="5" selected>5分</option>
            <option value="10">10分</option>
            <option value="15">15分</option>
          </select>
        </label>
        <label class="setting-item">
          <span>テーマ</span>
          <select id="themeSelect">
            <option value="light" selected>ライト</option>
            <option value="dark">ダーク</option>
            <option value="focus">フォーカス</option>
          </select>
        </label>
      </div>
      <div class="sound-row">
        <label><input id="soundStartToggle" type="checkbox" checked> 開始音</label>
        <label><input id="soundEndToggle" type="checkbox" checked> 終了音</label>
        <label><input id="soundTickToggle" type="checkbox"> tick音</label>
      </div>
    </div>

    <!-- 今日の進捗カード -->
    <div class="progress-card">
      <p class="progress-card-title">今日の進捗</p>
      <div class="progress-stats">
        <div class="stat">
          <span class="stat-value" id="completedCount">0</span>
          <span class="stat-label">完了</span>
        </div>
        <div class="stat">
          <span class="stat-value stat-highlight" id="focusTime">0分</span>
          <span class="stat-label">集中時間</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
